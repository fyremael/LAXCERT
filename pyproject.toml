[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laxforge-laxcert"
version = "0.1.0"
description = "LAXCERT Python emitter and proof-status pipeline"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "jsonschema>=4.22",
]

[project.scripts]
laxcert-console = "laxforge_laxcert.console_server:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
laxforge_laxcert = ["console_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
